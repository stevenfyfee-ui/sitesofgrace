{% extends "base.html" %}
{% load static %}

{% block body_class %}auth{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>Check your email</h1>
    <p class="auth-lede">
      We've sent a password reset link. If it doesn't arrive in a few minutes, check
      your spam folder.
    </p>
    <p class="auth-switch"><a href="{% url 'account_login' %}">&larr; Back to sign in</a></p>
  </div>
</section>
{% endblock %}
