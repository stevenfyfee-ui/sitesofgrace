{% comment %}
  Segmented reading-level pill (comp 03): two real buttons with aria-pressed.
  Without JavaScript this GET form reloads with ?level=; with it,
  future-saints.js swaps the visible text in place (no reload, no cookie).
{% endcomment %}
<form class="fs-pill-form" method="get" action="">
  <div class="fs-pill" role="group" aria-label="Reading level">
    <button type="submit" name="level" value="explorer" class="fs-pill-btn" data-fs-level data-fs-level-label="Reading level: Grades 2–3" aria-pressed="{% if fs_level == 'explorer' %}true{% else %}false{% endif %}">Grades 2–3</button>
    <button type="submit" name="level" value="researcher" class="fs-pill-btn" data-fs-level data-fs-level-label="Reading level: Grades 4–5" aria-pressed="{% if fs_level == 'researcher' %}true{% else %}false{% endif %}">Grades 4–5</button>
  </div>
  <p class="sr-only" data-fs-level-status aria-live="polite"></p>
</form>
