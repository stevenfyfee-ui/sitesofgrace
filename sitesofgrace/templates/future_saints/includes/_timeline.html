{% comment %} Vertical timeline with date chips. {% endcomment %}
{% if page.timeline.all %}
<ol class="fs-timeline">
  {% for entry in page.timeline.all %}
    <li class="fs-timeline-item">
      <span class="fs-date-chip">{{ entry.date_display }}</span>
      <p>{{ entry.text }}</p>
    </li>
  {% endfor %}
</ol>
{% elif request.user.is_staff %}<p class="fs-chip-staff">Staff only: no timeline entries yet.</p>{% endif %}
